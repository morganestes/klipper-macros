; Warning! When using big binder clips,  do not print Y < 35 || Y > 200.
[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    {% set MESH_NAME = params.MESH_NAME|default('default')|string %}
    {% set SKEW_NAME = params.SKEW_NAME|default('default')|string %}

    M117 Starting print

    G90 ; Use absolute coordinates
    M83 ; Use relative extrusion

    ; Make sure bed is level before continiuing
    M117 Checking bed level
    HOME
    ; If the tilt is off, stops the job so we can manually level the bed.
    SCREWS_TILT_CALCULATE MAX_DEVIATION=0.10

    ; Load up the mesh while the bed's at room temp.
    BED_MESH_CLEAR
    BED_MESH_PROFILE LOAD={MESH_NAME}
    SKEW_PROFILE LOAD={SKEW_NAME}

    M140 S{BED_TEMP} ; Start bed heating first since it takes longer

    M104 S{EXTRUDER_TEMP} ; set temp between min extrude and first layer
    G4 S10 ; hang out for a lil' bit

    G1 Z5 F3000 ; raise the nozzle a tad

    # Wait for bed to reach temperature
    M190 S{BED_TEMP}
    # Set and wait for nozzle to reach temperature
    M109 S{EXTRUDER_TEMP}

    # Dwell 30s
    G4 P30000

    PRE_START
